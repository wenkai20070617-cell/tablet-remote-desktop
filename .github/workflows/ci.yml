name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app launcher.py build_release.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        if: runner.os != 'Windows'
        run: sh -n run_cloudflare_tunnel.sh start.sh
      - name: Check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            "watch.ps1",
            "install_autostart.ps1",
            "start_detached.ps1",
            "stop_detached.ps1",
            "run_cloudflare_tunnel.ps1",
            "start.ps1"
          )) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$file::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PowerShell syntax OK"