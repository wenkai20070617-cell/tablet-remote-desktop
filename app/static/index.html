<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#090b0e" />
    <title>&#24179;&#26495;&#36828;&#25511;</title>
    <link rel="stylesheet" href="/static/styles.css?v=30" />
  </head>
  <body>
    <main class="shell">
      <section id="loginPanel" class="login-panel">
        <div class="login-box">
          <h1>&#24179;&#26495;&#36828;&#25511;</h1>
          <form id="loginForm">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              inputmode="text"
              placeholder="&#26412;&#22320;&#20108;&#27425;&#23494;&#30721;"
            />
            <button type="submit">&#36830;&#25509;</button>
          </form>
          <p id="loginMessage" aria-live="polite"></p>
        </div>
      </section>

      <section id="remotePanel" class="remote-panel hidden">
        <header class="topbar">
          <button id="keyboardButton" type="button" class="icon-button keyboard-button" title="&#38190;&#30424;">
            &#9000;
          </button>
          <div class="status-group">
            <span id="statusDot" class="status-dot"></span>
            <strong id="connectionState">&#36830;&#25509;&#20013;</strong>
            <span id="audioState">&#22768;&#38899;&#31561;&#24453;</span>
            <span id="transportState">WebSocket</span>
          </div>
          <div class="toolstrip" role="toolbar">
            <button id="zoomOut" type="button" class="icon-button" title="&#32553;&#23567;">&minus;</button>
            <button id="zoomReset" type="button" class="tool-button compact">100%</button>
            <button id="zoomIn" type="button" class="icon-button" title="&#25918;&#22823;">+</button>
            <button id="panToggle" type="button" class="tool-button" aria-pressed="false" title="&#25302;&#21160;&#30011;&#38754;">&#25302;&#21160;</button>
            <button id="monitorButton" type="button" class="tool-button" title="&#26174;&#31034;&#22120;">&#23631;1</button>
            <button id="filesButton" type="button" class="tool-button" title="&#25991;&#20214;&#20256;&#36755;">&#25991;&#20214;</button>
            <button id="pullClipboard" type="button" class="tool-button" title="Copy host clipboard">&#21462;&#21098;&#36148;&#26495;</button>
            <button id="pushClipboard" type="button" class="tool-button" title="Send local clipboard">&#21457;&#21098;&#36148;&#26495;</button>
            <button id="fullscreen" type="button" class="tool-button">&#20840;&#23631;</button>
            <button id="logout" type="button" class="tool-button danger">&#36864;&#20986;</button>
          </div>
          <div id="metricsHud" class="metrics-hud" aria-live="off">
            <button id="metricsToggle" type="button" class="metrics-toggle" title="&#24615;&#33021;&#30417;&#25511;">&#9632;</button>
            <dl class="metrics-grid">
              <div><dt>FPS</dt><dd id="metricFps">-</dd></div>
              <div><dt>&#24310;&#36831;</dt><dd id="metricLatency">-</dd></div>
              <div><dt>&#20002;&#21253;</dt><dd id="metricLoss">-</dd></div>
              <div><dt>&#30721;&#29575;</dt><dd id="metricBitrate">-</dd></div>
              <div><dt>&#27169;&#24335;</dt><dd id="metricMode">-</dd></div>
              <div><dt>&#20998;&#36776;&#29575;</dt><dd id="metricResolution">-</dd></div>
            </dl>
          </div>
        </header>

        <div id="viewer" class="viewer" tabindex="0">
          <div id="stage" class="stage">
            <video id="screenVideo" class="hidden" autoplay playsinline></video>
            <img id="screen" alt="remote screen" draggable="false" />
            <div id="cursorLayer" class="cursor-layer" aria-hidden="true">
              <svg id="remoteCursor" class="remote-cursor" viewBox="0 0 24 24" width="22" height="22">
                <path
                  d="M5 2 L5 20 L9.5 15.6 L12.4 22 L15.2 20.7 L12.3 14.4 L18.5 14.2 Z"
                  fill="#ffffff"
                  stroke="#111418"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
          <div id="emptyState" class="empty-state">&#31561;&#24453;&#30011;&#38754;</div>
        </div>

        <aside id="mouseControl" class="mouse-control collapsed" aria-label="mouse control">
          <button
            id="mouseToggle"
            type="button"
            class="mouse-toggle"
            aria-expanded="false"
            title="&#40736;&#26631;"
          >
            &#40736;
          </button>
          <div class="mouse-panel">
            <div class="mouse-title">&#40736;&#26631;</div>
            <div id="mousePad" class="mouse-pad" role="application"></div>
            <div class="mouse-row">
              <button
                id="mouseDragLock"
                type="button"
                class="mouse-drag-toggle"
                aria-pressed="false"
                title="&#25302;&#25341;&#38145;&#23450;"
              >
                &#25302;
              </button>
              <label class="mouse-speed">
                <span>&#36895;</span>
                <input
                  id="mouseSensitivity"
                  type="range"
                  min="0.7"
                  max="2.4"
                  step="0.1"
                  value="1.4"
                  aria-label="mouse speed"
                />
              </label>
            </div>
            <div class="mouse-buttons">
              <button id="mouseLeft" type="button">&#24038;</button>
              <button id="mouseRight" type="button">&#21491;</button>
            </div>
            <div id="mouseScrollPad" class="mouse-scroll-pad" role="application"></div>
            <div class="mouse-wheel">
              <button id="mouseWheelUp" type="button">&uarr;</button>
              <button id="mouseWheelDown" type="button">&darr;</button>
            </div>
          </div>
        </aside>

        <aside id="filePanel" class="file-panel hidden" aria-label="file transfer">
          <div class="file-header">
            <strong>&#25991;&#20214;&#20256;&#36755;</strong>
            <button id="filePanelClose" type="button" class="icon-button small">&times;</button>
          </div>
          <div class="file-roots">
            <button id="fileRootUpload" type="button" class="tool-button compact active">&#25509;&#25910;&#30446;&#24405;</button>
            <button id="fileRootDownload" type="button" class="tool-button compact">&#21457;&#36865;&#30446;&#24405;</button>
          </div>
          <div class="file-path" id="filePath">/</div>
          <div class="file-list" id="fileList"></div>
          <div class="file-actions">
            <button id="fileSendButton" type="button" class="tool-button">&#19978;&#20256;&#21040;&#27492;&#30446;&#24405;</button>
            <button id="fileUpButton" type="button" class="tool-button compact">&#19978;&#19968;&#23618;</button>
          </div>
          <div class="transfer-list" id="transferList"></div>
          <input id="filePicker" type="file" multiple class="hidden" />
        </aside>

        <textarea
          id="keyboardSink"
          class="keyboard-sink"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          inputmode="text"
          aria-hidden="true"
        ></textarea>
      </section>
    </main>
    <script src="/static/app.js?v=30"></script>
  </body>
</html>
